name: Validate compiled site
on:
  pull_request:
  push:
    branches: [main, develop, 'feat/**', 'feature/**', 'fix/**', 'chore/**']
permissions:
  contents: read
jobs:
  static-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify compiled output, links and Windows checkout bytes
        shell: python
        run: |
          import hashlib, json, pathlib, re, subprocess, tempfile
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root = pathlib.Path.cwd()
          state = json.loads((root / 'site-output.json').read_text(encoding='utf-8'))
          assert state['schema'] == 1 and state['generator'] == 'sambafied-static-site/v1'
          allowed = {'.html','.css','.js','.svg','.png','.jpg','.jpeg','.ico','.xml','.txt','.woff','.woff2','.ttf'}
          for name, expected in state['files'].items():
              path = root / name
              assert name == '.nojekyll' or all(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._@~-]*', part) for part in name.split('/')), name
              assert name == '.nojekyll' or path.suffix.lower() in allowed, name
              assert not path.is_symlink() and path.resolve().is_relative_to(root), name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          for name in ['index.html','products/dam-client/index.html','docs/index.html']:
              assert name in state['files'], name
          for name in ['package.json','package-lock.json','docusaurus.config.js','public-docs-source.json','src','static']:
              assert not (root / name).exists(), name
          assert not list((root / 'docs').rglob('*.md'))
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = []
              def handle_starttag(self, tag, attrs):
                  self.targets += [value for key, value in attrs if key in ('href', 'src') and value]
          for name in state['files']:
              if not name.endswith('.html'):
                  continue
              page = root / name
              links = Links()
              links.feed(page.read_text(encoding='utf-8'))
              for target in links.targets:
                  parsed = urlsplit(target)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  path = root / unquote(parsed.path).lstrip('/') if parsed.path.startswith('/') else page.parent / unquote(parsed.path)
                  if path.is_dir():
                      path = path / 'index.html'
                  assert path.resolve().is_relative_to(root) and path.is_file(), (name, target)
          with tempfile.TemporaryDirectory(prefix='compiled-checkout-') as temp:
              checkout = pathlib.Path(temp) / 'checkout'
              subprocess.run(['git','clone','--quiet','--no-hardlinks','--config','core.autocrlf=true',str(root),str(checkout)], check=True)
              for name, expected in state['files'].items():
                  assert hashlib.sha256((checkout / name).read_bytes()).hexdigest() == expected, name
          print('Verified', len(state['files']), 'compiled files, internal links and fresh autocrlf checkout')
